name: Unzip source archive

on:
  push:
    branches: ['main', 'master']
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: unzip-source
  cancel-in-progress: true

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find ZIP at repository root
        id: find
        run: |
          set -euo pipefail
          mapfile -t ZIPS < <(find . -maxdepth 1 -type f -name '*.zip' | sed 's|^\./||' | sort)
          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No ZIP file at repository root. Nothing to do."
            exit 0
          fi
          if [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "Multiple ZIP files found at root:"
            printf ' - %s\n' "${ZIPS[@]}"
            echo "Using the first one: ${ZIPS[0]}"
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "zip=${ZIPS[0]}" >> "$GITHUB_OUTPUT"
          echo "Found: ${ZIPS[0]}"

      - name: Unzip and remove archive
        if: steps.find.outputs.found == 'true'
        env:
          ZIP: ${{ steps.find.outputs.zip }}
        run: |
          set -euo pipefail
          echo "Extracting: $ZIP"
          TMPDIR=$(mktemp -d)
          unzip -q -o "$ZIP" -d "$TMPDIR"

          shopt -s dotglob nullglob
          ENTRIES=("$TMPDIR"/*)
          if [ "${#ENTRIES[@]}" -eq 1 ] && [ -d "${ENTRIES[0]}" ]; then
            SRC="${ENTRIES[0]}"
            echo "Single top-level folder: $(basename "$SRC")"
          else
            SRC="$TMPDIR"
          fi

          rm -rf "$SRC/.git" "$SRC/.github/workflows" "$SRC/__MACOSX"
          rm -f "$SRC/.env"
          rm -rf "$SRC/node_modules"

          cp -a "$SRC"/. .
          rm -rf "$TMPDIR"
          rm -f "$ZIP"
          echo "Removed archive: $ZIP"

      - name: Commit extracted files
        if: steps.find.outputs.found == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: unzip source archive and remove zip from repository"
          git push

      - name: Trigger deploy
        if: steps.find.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
