name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
    paths-ignore:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find project and build
        id: build
        run: |
          set -euo pipefail
          PKG=$(find . -name package.json -not -path '*/node_modules/*' -not -path './.git/*' | awk '{print length, $0}' | sort -n | head -1 | cut -d' ' -f2-)

          if [ -z "$PKG" ]; then
            if [ -f index.html ]; then
              echo "No package.json. Deploying static site from root."
              echo "out=." >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "No package.json and no index.html found. Repository files:"
            ls -la
            exit 1
          fi

          DIR=$(dirname "$PKG")
          echo "Project directory: $DIR"
          cd "$DIR"

          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run build

          for d in dist build out; do
            if [ -d "$d" ]; then
              echo "out=$DIR/$d" >> "$GITHUB_OUTPUT"
              echo "Build output: $DIR/$d"
              exit 0
            fi
          done

          echo "Build finished but no dist/build/out folder was created. Contents:"
          ls -la
          exit 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.build.outputs.out }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
