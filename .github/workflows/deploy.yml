name: Deploy Veyra AI to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project archive
        run: |
          mkdir -p extracted
          unzip -q veyra-ai-production-source.zip -d extracted

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find project and build
        id: build
        run: |
          PACKAGE_JSON=$(find extracted -name package.json -type f -print -quit)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json was not found in the ZIP archive."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_JSON")
          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          cd "$PROJECT_DIR"
          npm install --legacy-peer-deps
          npm run build

          if [ ! -d dist ]; then
            echo "ERROR: Build completed without a dist directory."
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: extracted/${{ steps.build.outputs.project_dir }}/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
